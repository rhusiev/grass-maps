name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

# A new commit on the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, build, unit tests, translations, boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Rust 1.93.1 with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      # --fast keeps this job to the incremental checks; the reproducibility
      # job runs the two release builds. The emulator jobs run the device
      # smoke, strict mode and the trend benchmarks.
      - name: Run the local gate (fast tier)
        run: ./check.sh --fast
      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/test-results/**
          if-no-files-found: ignore

  reproducibility:
    name: Byte-reproducible release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Rust 1.93.1 with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build twice in separate paths and compare
        run: ./scripts/ci/reproducibility.sh

  emulator-api29:
    name: API 29 emulator smoke and strict mode
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Rust 1.93.1 with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build the debug APK
        run: ./gradlew --console=plain :app:assembleDebug
      - name: Boot API 29 and run the smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          # The runner's post-boot settings calls hit the window where the
          # services answer "Broken pipe (32)"; the smoke does not need them.
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci/android-smoke.sh app/build/outputs/apk/debug/app-debug.apk

  # The Ferrostar core is an Android-only AAR, so every JVM test uses the
  # GeometryRouteFollower stand-in. This job is the only one that runs the
  # production follower, which decides where the user is on the route; it is a
  # real gate. API 29 matches the smoke and goldens jobs and the module's
  # minSdk 29 (the AAR itself needs only 25). The replay asserts positions, not
  # rendered colours, so it needs swiftshader rather than the goldens' swangle.
  emulator-navigation:
    name: Native follower replay (API 29)
    runs-on: ubuntu-latest
    # The checks job is ~11 minutes and the goldens job is ~86, so this job
    # runs in parallel and does not move the critical path.
    # The runner has no KVM; API 29 cold boots measured 117 s and 153 s, so the
    # action's 600 s boot bound holds.
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Rust 1.93.1 with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Run the native follower on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          # The replay is not a UI test, and the runner's animation settings
          # are its first adb calls after boot - the window where a slow boot
          # answers with "Broken pipe (32)". The script owns readiness instead.
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci/android-navigation-test.sh
      - name: Keep the instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navigation-connected-test-${{ github.sha }}
          path: |
            navigation/build/reports/androidTests/**
            navigation/build/outputs/androidTest-results/**
          if-no-files-found: warn

  # Fixture map goldens only: the committed T-0015 fixture asset, no region
  # package and no 59 MB archive. The whole-oblast goldens are local acceptance
  # on gm-emulator; CI must not depend on the bench archive. The Standard style
  # is captured light and dark over ten places at three zooms, then the T-0102
  # fixture set is compared on the same booted emulator.
  emulator-map-goldens:
    name: Style and fixture map goldens (API 29, swangle)
    runs-on: ubuntu-latest
    # Measured, not assumed. Run 42456896336 needed ~123 minutes: the old
    # 120-minute bound cancelled it during the last fixture. At 150 minutes the
    # margin did not hold either - the job was cancelled at the bound on 4 of
    # the 6 runs before 2026-11-10, and successful runs took 1 h 56 m to
    # 2 h 01 m. A job that regularly uses 96 % of its limit is the same risk as
    # one that fails, so the bound is 210 minutes until the capture is split.
    timeout-minutes: 210
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Rust 1.93.1 with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build the debug APK
        run: ./gradlew --console=plain :app:assembleDebug
      - name: Boot API 29 and compare the style goldens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # swangle renders text colours correctly; swiftshader_indirect drops
          # the green channel of every text colour, which turns light labels on
          # the dark style magenta (T-0108). The comparator is unchanged.
          emulator-options: -no-snapshot -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci/android-goldens-ci.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Keep the goldens and diff images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-goldens-${{ github.sha }}
          path: build/map-goldens/**
          if-no-files-found: warn

  # Trend numbers only, not the Moto g32 acceptance gate. The JSON lands in
  # build/benchmarks/ and is uploaded keyed by commit. A commit that regresses
  # a budget does not fail this job yet; the budget gate belongs to the map and
  # benchmark harness tasks that follow.
  benchmarks:
    name: Emulator benchmarks (cold start and frame pacing, trend only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Trend data only, not the g32 gate; that must not block the real gate. A
    # red job still names the missing data and uploads no JSON. Seven jobs
    # between 2026-11-09 and 2026-11-11 failed before the measurement started,
    # six in the runner's own post-boot calls and one in the first install,
    # every one with "Broken pipe (32)" (42564988652, 42575135546, 42607425070,
    # 42701960189, 42739619598, 42765594723, 42959054167). The runner has no
    # KVM (the action logs "-accel off"), so API 35 boots take 7-10 minutes; the
    # 900 s bound and the script's service gate are the fix. The action's own
    # `input keyevent 82` cannot be gated from here; a failure is left red.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Rust 1.93.1 with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build the debug APK
        run: ./gradlew --console=plain :app:assembleDebug
      - name: Boot the emulator and run the benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          # android-benchmark.sh disables the animations after the system
          # services answer. The runner did it as its first adb call after
          # boot, in the window where a slow boot fails with
          # "cmd: Failure calling service ...: Broken pipe (32)".
          disable-animations: false
          # The runner has no KVM: the action runs the emulator with
          # `-accel off`. API 35 cold boots measured 468.6 s and 616.3 s, so
          # the 600 s default is too short; 900 s is the measured bound.
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: BENCH_DEVICE_SOURCE=ci-runner BENCH_GPU_MODE=swiftshader_indirect ./scripts/ci/android-benchmark.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload the benchmark JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-emulator-api35-${{ github.sha }}
          path: build/benchmarks/*.json
          if-no-files-found: warn

  # The design asks for an iOS target compile on a macOS runner "once iOS code
  # exists" (walking-skeleton.md, T-0011; architecture.md section 24). There is
  # no iOS or Kotlin Multiplatform target yet, so this job reports the gap
  # instead of pretending to build one. Replace the pending-check call with the
  # real macOS build when the target lands; do not delete the job.
  ios-target-compile:
    name: iOS target compile (pending, no iOS target yet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Report the pending check
        run: ./scripts/ci/pending-check.sh "iOS target compile on a macOS runner" "No iOS or Kotlin Multiplatform target exists in the repo yet."
