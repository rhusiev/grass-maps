name: Map goldens

# The map goldens are a cadence check, not a per-merge gate. On the push path
# they sat inside a per-branch cancel-in-progress group, and the next merge to
# dev (every 20-30 minutes) cancelled the two-hour capture. A cancelled job
# attests to nothing. This workflow runs the same job every three hours and on
# demand, and it never cancels a run that started.
#
# GitHub starts a schedule only from the default branch's copy of this file, so
# the three-hour cadence begins after this workflow reaches main. A dispatch can
# then run it for a chosen branch.
on:
  # A push that can change what the map draws runs the comparison, and is
  # allowed to finish. Without this, a rendering change would reach dev with no
  # goldens evidence at all until the next three-hourly run - the schedule is
  # dormant on dev because GitHub reads schedules only from the default branch.
  # Every path here can alter a rendered frame; anything else (app wiring,
  # tracks, navigation, docs) does not need a two-hour emulator.
  push:
    branches:
      - dev
    paths:
      - 'plugins/style-standard/**'   # the style itself
      - 'plugins/style-touring/**'
      - 'plugins/layers-panel/**'
      - 'app/src/main/assets/sprites/**'
      - 'app/src/main/assets/fonts/**'
      - 'test-data/map-goldens/**'    # the references and their fixtures
      - 'scripts/ci/*golden*'         # the capture and comparison code
  schedule:
    # Every three hours at :15 UTC. The minute avoids the top-of-hour queue.
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to check out and compare. Empty uses the branch the dispatch runs from.'
        required: false
        type: string
        default: ''

# One run per tested ref. Scheduled runs all test dev, so they queue behind
# each other and none is cancelled. A dispatch of another branch gets its own
# group and can run while a scheduled run is busy.
concurrency:
  group: map-goldens-${{ inputs.ref || (github.event_name == 'schedule' && 'dev') || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apk:
    name: Build the debug APK for the goldens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Keep this expression in sync with the concurrency group. A schedule
          # always tests dev because the default branch is main.
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'dev') || github.ref }}
      - name: Record the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install the pinned Android NDK
        run: ./scripts/ci/install-pinned-ndk.sh
      - name: Set up Rust 1.93.1 with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Build the debug APK
        run: ./gradlew --console=plain :app:assembleDebug
      - name: Keep the APK for the golden sets
        uses: actions/upload-artifact@v7
        with:
          name: goldens-apk-${{ steps.tested.outputs.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  emulator-map-goldens:
    name: Map goldens - ${{ matrix.set }} (API 29, swangle)
    needs: build-apk
    runs-on: ubuntu-latest
    # One job ran every set on one emulator and took 1 h 55 m to 3 h 05 m;
    # run a36dca45 was cancelled at its 210-minute bound. Measured on run
    # 903d1cc8 (2 h 37 m): build and boot ~23 min, Standard light ~46 min,
    # dark ~42 min, the other four sets ~46 min together. Each set now boots
    # its own emulator in parallel, the longest ~70 min with the APK fetch and
    # boot; 100 minutes leaves a margin of about 40 %.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        set: [standard-light, standard-dark, touring-light, touring-dark, contours, fixture, navigation, raster]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-apk.outputs.sha }}
      - name: Fetch the APK
        uses: actions/download-artifact@v7
        with:
          name: goldens-apk-${{ needs.build-apk.outputs.sha }}
          path: app/build/outputs/apk/debug
      - name: Boot API 29 and compare the ${{ matrix.set }} goldens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # swangle renders text colours correctly; swiftshader_indirect drops
          # the green channel of every text colour, which turns light labels on
          # the dark style magenta (T-0108). The comparator is unchanged.
          emulator-options: -no-snapshot -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: EXPECTED_API_LEVEL=29 ./scripts/ci/android-goldens-ci.sh app/build/outputs/apk/debug/app-debug.apk ${{ matrix.set }}
      - name: Keep the goldens and diff images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Name the commit that was actually captured, not the dispatch ref.
          name: map-goldens-${{ matrix.set }}-${{ needs.build-apk.outputs.sha }}
          path: build/map-goldens/**
          if-no-files-found: warn
