[package]
name = "grass-regions"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
name = "grass_regions"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.18"
uniffi = { version = "0.32.2" }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# The Kotlin bindings are generated by the host-only `uniffi-bindgen` binary.
# Keeping the CLI out of the library graph keeps `uniffi_bindgen` out of the
# shipped cdylib, where its codegen is not reproducible.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
